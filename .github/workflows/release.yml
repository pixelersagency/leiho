name: Release

# Push a tag like v1.0.0 or v1.0.0-beta.2: the plugin zip is attached to a
# GitHub release, and the bridge is published to npm through Trusted Publishing
# (OIDC, configured on npmjs.com for this workflow): no npm token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches plugin version
        run: |
          VERSION="$(sed -n "s/^define( 'LEIHO_VERSION', '\(.*\)' );/\1/p" plugin/leiho.php)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zip
        run: ./scripts/build-zip.sh

      # Every site checks this signature before installing an update
      # (Leiho_Updater::SIGNING_KEY). The private key only lives in the
      # LEIHO_SIGNING_KEY secret: no secret, no release.
      - name: Sign zip
        env:
          LEIHO_SIGNING_KEY: ${{ secrets.LEIHO_SIGNING_KEY }}
        run: |
          if [ -z "$LEIHO_SIGNING_KEY" ]; then
            echo "The LEIHO_SIGNING_KEY secret is missing: sites would refuse this update." >&2
            exit 1
          fi
          ZIP="dist/leiho-$VERSION.zip"
          # Signed message: "leiho", the version and the archive's SHA-256 (Leiho_Updater::signed_message),
          # so an old signed archive can't be republished under a newer tag.
          php -r 'file_put_contents($argv[1] . ".sig", base64_encode(sodium_crypto_sign_detached("leiho\n" . $argv[2] . "\n" . hash_file("sha256", $argv[1]), base64_decode(getenv("LEIHO_SIGNING_KEY"), true))));' "$ZIP" "$VERSION"
          # Checked with the public key shipped in the plugin: a wrong secret fails here, not on every site.
          PUB="$(grep -o "SIGNING_KEY = '[^']*'" plugin/includes/class-leiho-updater.php | cut -d"'" -f2)"
          php -r 'define("ABSPATH", 1); require "plugin/includes/class-leiho-updater.php"; exit(Leiho_Updater::verify(file_get_contents($argv[1]), file_get_contents($argv[1] . ".sig"), $argv[2], $argv[3]) ? 0 : 1);' "$ZIP" "$VERSION" "$PUB"

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deux fichiers identiques : leiho-<version>.zip pour l'archive, et
          # leiho.zip pour un lien de téléchargement stable :
          # https://github.com/<repo>/releases/latest/download/leiho.zip
          cp "dist/leiho-$VERSION.zip" dist/leiho.zip
          cp "dist/leiho-$VERSION.zip.sig" dist/leiho.zip.sig
          # Toute version est marquée « latest » (bêta comprise) : une
          # pré-release est exclue de /releases/latest, le lien casserait.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/leiho-$VERSION.zip" "dist/leiho-$VERSION.zip.sig" dist/leiho.zip dist/leiho.zip.sig --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/leiho-$VERSION.zip" "dist/leiho-$VERSION.zip.sig" dist/leiho.zip dist/leiho.zip.sig \
              --title "Leiho $VERSION" --notes-file notes.md --latest
          fi

      - name: Publish bridge to npm
        working-directory: bridge
        run: |
          # Trusted Publishing needs npm 11.5.1 or later.
          npm install -g npm@11.21.2
          TAG=latest
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version > /dev/null 2>&1; then
            echo "Already on npm, skipping."
            exit 0
          fi
          npm publish --access public --provenance --tag "$TAG"

      - name: Rebuild leiho.dev
        # leiho.dev lit la dernière release au build (version affichée, démo /try) :
        # on relance son déploiement Coolify. Sans secret, l'étape ne fait rien.
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN not set, skipping."
            exit 0
          fi
          curl -fsS -o /dev/null -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.mynto.fr/api/v1/deploy?uuid=jfy9av3epkehhovzlbhso5wk" \
            || echo "::warning::leiho.dev rebuild request failed"
