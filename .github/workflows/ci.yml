name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Lint
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: |
          php plugin/tests/test-acf-adapter.php
          php plugin/tests/test-content.php
          php plugin/tests/test-cache.php
          php plugin/tests/test-collections.php
          php plugin/tests/test-acf-import.php
          php plugin/tests/test-native-fields.php
          php plugin/tests/test-activity.php
          php plugin/tests/test-frame-verdict.php
          php plugin/tests/test-updater.php
          php plugin/tests/test-autopublish.php
          php plugin/tests/test-app.php
          php plugin/tests/test-ai.php
          php plugin/tests/test-abilities-admin.php
          php plugin/tests/test-legacy.php
          php plugin/tests/test-onboarding.php
          php plugin/tests/test-seo.php
          php plugin/tests/test-security.php
          curl -fsSL https://wordpress.org/latest.tar.gz | tar xz -C "$RUNNER_TEMP"
          WP_DIR="$RUNNER_TEMP/wordpress" php plugin/tests/test-blocks.php
          php plugin/tests/smoke-load.php

  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Build
        working-directory: bridge
        run: npm run build
      - name: Content client tests
        working-directory: bridge
        run: npm test
      - name: Generated TypeScript compiles
        run: |
          npm install -g typescript@5.6.3 > /dev/null
          php plugin/tests/test-content.php
          php plugin/tests/test-collections.php
      - name: Built files are committed
        run: git diff --exit-code -- bridge/dist plugin/assets/bridge
      - name: Translations are complete and up to date
        run: |
          sudo apt-get install -y -qq gettext > /dev/null
          python3 scripts/i18n.py --check
      - name: Syntax
        run: |
          node --check plugin/assets/admin/editor.js
          node --check plugin/assets/admin/admin.js
          node --check plugin/assets/admin/autopublish.js
          node --check plugin/assets/admin/app.js
          node --check plugin/assets/admin/app-content.js
          node --check plugin/assets/admin/app-collections.js
          node --check plugin/assets/admin/app-media.js
          node --check plugin/assets/admin/ui.js
          node --check plugin/assets/admin/ai.js
          node --check bridge/bin/leiho.js

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [php, bridge]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build zip
        run: ./scripts/build-zip.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leiho-plugin
          path: dist/*.zip

  # Plugin Check (WordPress.org's official checker): security, escaping,
  # sanitizing, i18n and repository rules, run on the zip that ships.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    needs: [php, bridge]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build zip
        run: |
          ./scripts/build-zip.sh
          unzip -q dist/leiho-*.zip -d dist/plugin
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: dist/plugin/leiho
          # Leiho is distributed from GitHub with its own (signed) updates, which
          # WordPress.org forbids; the .org build will leave the updater out.
          ignore-codes: plugin_updater_detected
